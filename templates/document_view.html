{% extends "base.html" %}
{% block title %}{{ doc.title }} — PSE{% endblock %}
{% block content %}
<h1 class="ellip">{{ doc.title }}</h1>
<p class="muted">{{ doc.path }}</p>
<p>
  <span class="badge badge-type">{{ doc.doc_type }}</span>
  <span class="badge badge-{{ doc.category }}">{{ doc.category }}</span>
  {% for t in tags %}<span class="chip">{{ t }}</span>{% endfor %}
</p>

<form method="post" action="{{ url_for('manage.doc_category', doc_id=doc.id) }}" class="bar">
  <input type="hidden" name="_csrf" value="{{ session['_csrf'] }}">
  <select name="category">
    {% for c in ['banned','unbanned','uncategorized'] %}
    <option value="{{ c }}" {% if doc.category == c %}selected{% endif %}>{{ c }}</option>
    {% endfor %}
  </select>
  <button type="submit">Set category</button>
</form>

<form method="post" action="{{ url_for('manage.doc_tags', doc_id=doc.id) }}" class="bar">
  <input type="hidden" name="_csrf" value="{{ session['_csrf'] }}">
  <input type="hidden" name="action" value="set">
  <input type="text" name="tags" value="{{ tags | join(', ') }}" class="grow"
         placeholder="comma-separated tags">
  <button type="submit">Set tags</button>
</form>

<section class="card">
  <h3>Extracted content</h3>
  <pre class="content">{{ content }}</pre>
</section>
<p><a class="btn" href="{{ url_for('manage.documents') }}">&laquo; Back to documents</a></p>
{% endblock %}
